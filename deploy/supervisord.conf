[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Main service: Express API + WebSocket + static (port = Railway $PORT) ──
[program:sentinel]
command=node ws-server/index.js
directory=/app
autorestart=true
startsecs=5
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Activation service: credits / Dodo webhook / sqlite (:8080) ──
[program:activation]
command=node src/server.js
directory=/app/services/teos-activation-service
environment=PORT="8080"
autorestart=true
startsecs=5
startretries=20
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Telegram bot + Express API (:8082) ──
[program:linker-bot]
command=node --max-old-space-size=460 src/index.js
directory=/app/services/teoslinker-bot
environment=PORT="8082",ACTIVATION_API="http://localhost:8080",SENTINEL_URL="http://localhost:3000"
autorestart=true
startsecs=5
startretries=20
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Superintelligence: FastAPI / uvicorn (:8000) ──
[program:superintelligence]
command=/opt/venv/bin/uvicorn src.api.main:app --host 0.0.0.0 --port 8000
directory=/app/services/teos-superintelligence
environment=PORT="8000",SENTINEL_URL="http://localhost:3000"
autorestart=true
startsecs=15
startretries=20
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
