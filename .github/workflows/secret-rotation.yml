name: TEOS Secret Rotation
on:
  schedule:
    - cron: "0 09 * * 1"   # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Rotation mode'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - apply

permissions:
  contents: read

jobs:
  check-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secret rotation status
        id: check
        run: |
          echo "=== TEOS Secret Rotation Status ==="
          # Validate all 18 secrets are tracked
          SECRET_COUNT=$(grep -c "^S[0-9][0-9]:" scripts/secret-rotate.sh 2>/dev/null || echo 0)
          echo "Secrets tracked: ${SECRET_COUNT}"
          if [ "$SECRET_COUNT" -lt 18 ]; then
            echo "WARNING: Expected 18 secrets, found ${SECRET_COUNT}"
          fi

      - name: Check due secrets
        id: due
        run: |
          # Check if any secrets are due by examining state files
          DUE_COUNT=0
          if [ -d "data/secret-rotation" ]; then
            for state_file in data/secret-rotation/S*.txt; do
              [ -f "$state_file" ] || continue
              SECRET_ID=$(basename "$state_file" .txt)
              LAST=$(cat "$state_file")
              NOW=$(date -u +%s)
              LAST_EPOCH=$(date -d "$LAST" +%s 2>/dev/null || echo 0)
              ELAPSED=$(( (NOW - LAST_EPOCH) / 86400 ))
              # Look up rotation interval for this secret
              INTERVAL=$(grep "^${SECRET_ID}:" scripts/secret-rotate.sh | cut -d: -f3 2>/dev/null || echo 90)
              if [ "$ELAPSED" -ge "$INTERVAL" ]; then
                echo "DUE: ${SECRET_ID} (${ELAPSED}d elapsed, ${INTERVAL}d interval)"
                DUE_COUNT=$((DUE_COUNT + 1))
              fi
            done
          else
            echo "No rotation state directory found — all secrets are due"
            DUE_COUNT=18
          fi
          echo "due_count=${DUE_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Create issue if secrets are due
        if: steps.due.outputs.due_count > 0
        uses: actions/github-script@v9
        with:
          script: |
            const dueCount = ${{ steps.due.outputs.due_count }};
            const body = `## 🔑 TEOS Secret Rotation Required

            **${dueCount} secret(s) are past their rotation due date.**

            ### Action Required
            1. Run \`bash scripts/secret-rotate.sh --check\` locally to see which secrets are due
            2. Rotate each due secret: \`bash scripts/secret-rotate.sh <ID>\`
            3. Update Railway environment variables for each rotated secret
            4. Run \`bash scripts/secret-scan.sh\` to verify no secrets leaked

            ### Quick Rotation
            \`\`\`bash
            bash scripts/secret-rotate.sh --apply
            \`\`\`

            This issue was auto-generated by the TEOS Secret Rotation workflow.
            `;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SECURITY] ${dueCount} secret(s) require rotation`,
              body: body,
              labels: ['security', 'automated']
            });

  auto-rotate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run automated rotation
        run: |
          bash scripts/secret-rotate.sh --apply

      - name: Verify no secrets in source
        run: |
          bash scripts/secret-scan.sh

      - name: Create rotation report
        run: |
          echo "=== Rotation Complete ==="
          echo "Review and update Railway environment variables."
          echo "Run locally: bash scripts/secret-rotate.sh --check"
