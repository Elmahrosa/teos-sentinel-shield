name: action-smoke-test

on: [push, pull_request, workflow_dispatch]

jobs:
  # NOTE: the job id `smoke` is the required status check on `main`.
  # Do not rename it, or branch protection can never be satisfied again.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:action

      # Local mode: the engine runs inside the runner. No API key, no network
      # calls to the (retired) Railway endpoint, no external secrets.
      - name: Smoke test - ALLOW benign command
        id: allow-test
        uses: ./
        with:
          mode: local
          engine: core
          scan-target: 'npm run build'

      - name: Smoke test - BLOCK malicious command
        id: block-test
        continue-on-error: true
        uses: ./
        with:
          mode: local
          engine: core
          scan-target: 'rm -rf /'

      - name: Verify BLOCK verdict
        run: |
          if [ "${{ steps.block-test.outcome }}" != "failure" ]; then
            echo "Smoke test FAILED: the action did not fail on a malicious command."
            exit 1
          fi
          echo "Smoke test passed: local engine blocked the malicious command."
