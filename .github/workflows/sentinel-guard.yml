name: sentinel-guard-example

on:
  workflow_dispatch:
    inputs:
      scan-target:
        description: 'Command, script, or path to scan'
        required: false
        default: 'npm run build'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate step with TEOS Sentinel Shield (Marketplace)
        uses: Elmahrosa/teos-sentinel-shield@v5.1.0
        with:
          api-key: ${{ secrets.TEOS_TEST_API_KEY }}
          scan-target: ${{ inputs.scan-target }}
      - name: Post-guard echo (skipped when the gate BLOCKs)
        run: echo "RUN-AFTER-SENTINEL-GUARD"