name: 'TEOS Sentinel Shield Guard'
description: 'Deterministic pre-execution runtime security and governance engine for automated CI/CD pipelines.'
author: 'Elmahrosa International'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  mode:
    description: >-
      Execution mode. "auto" (default) runs the engine locally in the runner
      when no api-key is supplied and against the remote API when one is.
      "local" always runs in-runner with zero network calls and no data
      exfiltration. "remote" always calls the hosted scan API.
    required: false
    default: 'auto'
  api-key:
    description: >-
      The x-api-key used to authenticate with the TEOS Sentinel Shield scan API.
      Required only in remote mode (mode: remote, or mode: auto with an api-key).
    required: false
    default: ''
  scan-target:
    description: >-
      The command, code file, script, or directory path to inspect before
      execution.
    required: true
    default: '.'
  engine:
    description: >-
      Rule pack to use in local mode. One of: core, banking, solana, evm,
      dependency (deps), ci, tokenIntel (token-intelligence), dueDiligence
      (due-diligence). Ignored in remote mode, which uses the API's engine.
    required: false
    default: 'core'
  api-url:
    description: >-
      Base URL of the TEOS Sentinel Shield scan API. Must be https and either
      the default endpoint or an origin listed in the TEOS_APPROVED_API_URLS
      environment variable. Production workflows should omit this input.
    required: false
    default: 'https://teos-sentinel-shield-production.up.railway.app'
  api-path:
    description: >-
      Endpoint path that accepts the scan payload (POST).
    required: false
    default: '/scan'
  fail-open:
    description: >-
      If "true", pass the run when the scan API is unreachable. Defaults to
      fail-closed (BLOCK) for security. Emits an error annotation when used
      and is ignored on protected branches.
    required: false
    default: 'false'
  timeout-seconds:
    description: >-
      Per-request timeout in seconds (clamped to 10-60).
    required: false
    default: '15'

outputs:
  verdict:
    description: 'The deterministic verdict: ALLOW, WARN, REVIEW, or BLOCK (UNVERIFIED when fail-open skipped the scan).'
  risk-score:
    description: 'Risk score (0-100) returned by the deterministic engine.'
  rule-id:
    description: 'The highest-severity rule that matched the scan target.'

runs:
  using: 'node24'
  main: 'dist/index.js'